<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="innerDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Telemetry Sensor Grid Rings (Netra Radar) -->
  <circle cx="256" cy="276" r="170" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="276" r="125" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="256" cy="276" r="80" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Central Water Drop (Jal) -->
  <path d="M256 86 C256 86, 140 226, 140 316 C140 380.065, 191.935 432, 256 432 C320.065 432, 372 380.065, 372 316 C372 226, 256 86, 256 86 Z"
        fill="url(#dropGrad)"
        filter="url(#glow)"/>

  <!-- Inner Water Glass Highlight -->
  <path d="M256 124 C256 124, 168 238, 168 312 C168 360.598, 207.402 400, 256 400 C274.6 400, 291.8 394.2, 306 384 C280 380, 240 354, 240 300 C240 240, 256 124, 256 124 Z"
        fill="url(#innerDrop)"/>

  <!-- Intelligent Iris / Observation Well Core (Netra Eye Sensor) -->
  <circle cx="256" cy="316" r="42" fill="#0369A1" stroke="#BAE6FD" stroke-width="6"/>
  <circle cx="256" cy="316" r="22" fill="#E0F2FE"/>
  <circle cx="248" cy="308" r="8" fill="#FFFFFF"/>

  <!-- Water Pulse Ripple Base Lines -->
  <path d="M190 348 C206 364, 230 374, 256 374 C282 374, 306 364, 322 348"
        fill="none" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M212 378 C224 386, 239 390, 256 390 C273 390, 288 386, 300 378"
        fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>